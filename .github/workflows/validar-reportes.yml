name: Validar levantamientos y registro de componentes
on:
  push:
    branches:
      - feature/levantamientos-partes-fotos-20261027
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  reportes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar scripts y formularios
        run: |
          node --check componentes-registro.js
          node --check ai-assistant.js
          node --test tests/partes.test.cjs
